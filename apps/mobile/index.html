<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)" />
    <title>面试训练</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f3f6f2;
        color-scheme: light;
      }
      .startup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(32px, env(safe-area-inset-top)) 32px max(32px, env(safe-area-inset-bottom));
        color: #16302a;
        font-family: system-ui, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        text-align: center;
      }
      .startup-logo {
        width: 132px;
        height: 132px;
      }
      .startup h1 {
        margin: 8px 0 14px;
        font-size: 32px;
        font-weight: 650;
        letter-spacing: 0.08em;
      }
      .startup p {
        margin: 0;
        color: #53685f;
        font-size: 14px;
        line-height: 1.8;
      }
      .startup-status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 48px;
        color: #53685f;
        font-size: 13px;
      }
      .startup-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #ccd7ce;
        border-top-color: #155947;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #101614;
          color-scheme: dark;
        }
        .startup {
          color: #e8f2ec;
        }
        .startup p,
        .startup-status {
          color: #a8bab2;
        }
        .startup-spinner {
          border-color: #2d3d36;
          border-top-color: #8ed7bc;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup" role="status" aria-live="polite">
        <svg class="startup-logo" viewBox="0 0 108 108" fill="none" aria-hidden="true">
          <path
            d="M40 22H68Q86 22 86 40V68Q86 86 68 86H40Q22 86 22 68V40Q22 22 40 22Z"
            fill="#155947"
          />
          <path
            d="M40 37H68Q73 37 73 42V59Q73 64 68 64H51L40 73V64Q35 64 35 59V42Q35 37 40 37Z"
            fill="white"
          />
          <path
            d="M44 50L51 56L64 45"
            stroke="#155947"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <h1>面试训练</h1>
        <p>把真实经历，练成有力的回答。</p>
        <div class="startup-status">
          <span class="startup-spinner" aria-hidden="true"></span>
          正在启动…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
